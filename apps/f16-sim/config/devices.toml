# Input devices of the f16-sim host.
#
# Each control (pitch, roll, yaw, throttle) reads one axis of one device. A device is matched by a
# case-insensitive part of its name (see `uv run f16sim --list-devices`), or by its index when
# `device` is a number. A missing device falls back to the keyboard for that control.
#
#   device    name fragment ("" = the first joystick) or index
#   axis      SDL axis number on that device
#   invert    true flips the sign (many sticks give -1 for "aft")
#   deadzone  fraction of the travel around the centre that reads 0 (the rest is rescaled)
#   expo      0 = linear .. 1 = cubic: softer around the centre, full deflection unchanged
#   range     "bipolar" (-1..1, the sticks and the pedals) or "unipolar" (the throttle: the
#             axis' -1..1 becomes 0..1)
#
# Throttle: 0 idle, 0.77 military power, 1 full afterburner.

[pitch]
device = ""
axis = 1
invert = true        # SDL: stick forward is -1 on most sticks; the FMU wants +1 = aft (pull)
deadzone = 0.04
expo = 0.3

[roll]
device = ""
axis = 0
invert = false       # +1 = roll right
deadzone = 0.04
expo = 0.3

[yaw]
# A separate pedal device (rudder pedals) is common; its name fragment goes here, e.g. "rudder".
# Without one, set the stick's twist axis (often 3 or 5) and device = "".
device = "pedal"
axis = 2
invert = false       # +1 = right pedal = nose right
deadzone = 0.05
expo = 0.2

[throttle]
# A separate throttle quadrant: its name fragment. Use "" for the throttle lever of the stick.
device = "throttle"
axis = 2
invert = true        # SDL: throttle forward is usually -1
deadzone = 0.0
expo = 0.0
range = "unipolar"

[keyboard]
# Keyboard fallback for every control without a device: arrows (or W/S, A/D) move the stick and
# spring back when released, Q/E (or Z/X) the pedals, PgUp/PgDn (or +/-) the throttle.
stick_rate = 2.5     # 1/s: how fast a held key moves the stick
spring = 4.0         # 1/s: how fast a released stick returns to the centre
throttle_rate = 0.4  # 1/s
