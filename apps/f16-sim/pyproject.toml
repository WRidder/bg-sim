[project]
name = "f16-sim"
version = "0.1.0"
description = "A small real-time flight simulator around the f16-sim FMU exported by bg-sim"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fmpy>=0.3.20",
    "numpy>=2.0",
    "panda3d>=1.10.15",
    "panda3d-gltf>=1.2",
    "pygame-ce>=2.5",
]

[project.scripts]
f16sim = "f16sim.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f16sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
