[project]
name = "a109-sim"
version = "0.1.0"
description = "A small real-time helicopter simulator around the a109-sim FMU (Agusta A109) exported by bg-sim"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fmpy>=0.3.20",
    "numpy>=2.0",
    "panda3d>=1.10.15",
    "pygame-ce>=2.5",
]

[project.scripts]
a109sim = "a109sim.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a109sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
