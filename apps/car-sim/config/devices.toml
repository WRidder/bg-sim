# Input devices of the car-sim host.
#
# Each control (steer, throttle, brake) reads one axis of one device. A device is matched by a
# case-insensitive part of its name (see `uv run carsim --list-devices`), or by its index when
# `device` is a number. A missing device falls back to the keyboard for that control. With a
# device bound, the keyboard still works: per control, the input touched last wins.
#
#   device    name fragment ("" = the first joystick) or index
#   axis      SDL axis number on that device
#   invert    true flips the sign
#   deadzone  fraction of the travel around the centre (or the rest position) that reads 0
#   expo      0 = linear .. 1 = cubic: softer around the centre, full deflection unchanged
#   range     "bipolar" (-1..1: the steering) or "unipolar" (the pedals: the axis' -1..1
#             becomes 0..1)
#
# Steering: -1 full left, +1 full right (20 deg road-wheel lock on the race car, 30 deg on the buggy).

[steer]
device = ""
axis = 0
invert = false
deadzone = 0.02
expo = 0.2

[throttle]
# A wheel's pedal set is often a separate device: put its name fragment here.
device = ""
axis = 5             # gamepads: the right trigger (rests at -1)
invert = false
deadzone = 0.02
expo = 0.0
range = "unipolar"

[brake]
device = ""
axis = 4             # gamepads: the left trigger (rests at -1)
invert = false
deadzone = 0.02
expo = 0.0
range = "unipolar"

[handbrake]
device = ""
button = 0           # held

[reverse]
device = ""
button = 3           # pressed: forward/reverse, only at a standstill

[keyboard]
# Keyboard driving: left/right (or A/D) steer and return to the centre when released, up (W) the
# accelerator, down (S) the brake, space the handbrake, V forward/reverse.
steer_rate = 2.2     # 1/s: how fast a held key turns the steering
steer_return = 3.0   # 1/s: how fast a released steering returns to the centre
pedal_rate = 3.0     # 1/s: how fast a held key presses a pedal
pedal_release = 5.0  # 1/s: how fast a released pedal comes back
